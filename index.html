<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8dde5">
  <meta name="description" content="Bday ni Mutya">
  <title>Bday ni Mutya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>
  <div class="floral-wash floral-wash--top" aria-hidden="true">
    <svg viewBox="0 0 540 420" role="presentation">
      <path class="stem" d="M360 430 C350 320 330 240 260 150 M358 330 C420 260 455 235 520 220 M300 235 C240 205 190 190 125 205"/>
      <path class="leaf" d="M345 315 C280 270 240 286 224 335 C279 347 319 338 345 315Z"/>
      <path class="leaf" d="M405 280 C436 220 485 208 519 219 C499 268 456 291 405 280Z"/>
      <path class="leaf" d="M223 204 C170 153 125 164 103 205 C153 231 190 224 223 204Z"/>
      <g class="lily" transform="translate(255 150) rotate(-18)">
        <path d="M0 0 C-55 -85 -88 -31 -42 8 C-88 35 -55 90 0 20 C55 90 88 35 42 8 C88 -31 55 -85 0 0Z"/>
        <path d="M0 0 C-18 -94 18 -94 0 0Z"/>
        <path class="vein" d="M0 4 L-42 -35 M0 4 L42 -35 M0 4 L-38 43 M0 4 L38 43"/>
        <circle cx="0" cy="6" r="5"/>
      </g>
      <g class="tulip" transform="translate(490 192) rotate(18)">
        <path d="M0 13 C-54 -4 -62 -62 -40 -83 C-22 -66 -11 -61 0 -85 C12 -61 22 -66 41 -83 C62 -62 54 -4 0 13Z"/>
        <path class="vein" d="M0 9 L0 -65"/>
      </g>
      <g class="tulip tulip--small" transform="translate(112 186) rotate(-12)">
        <path d="M0 13 C-54 -4 -62 -62 -40 -83 C-22 -66 -11 -61 0 -85 C12 -61 22 -66 41 -83 C62 -62 54 -4 0 13Z"/>
        <path class="vein" d="M0 9 L0 -65"/>
      </g>
    </svg>
  </div>

  <header class="topbar">
    <a class="wordmark" href="#envelope" aria-label="Bday ni Mutya home">Bday ni Mutya</a>
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open sections" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="side-nav" id="sideNav" aria-label="Sections" aria-hidden="true">
    <button class="nav-link" type="button" data-target="envelope" aria-label="Sealed envelope" title="Sealed envelope">👩‍❤️‍👩</button>
    <button class="nav-link" type="button" data-target="home" aria-label="Homepage" title="Homepage">👩‍❤️‍💋‍👩</button>
    <button class="nav-link" type="button" data-target="archive" aria-label="Photo archive" title="Photo archive">💏</button>
    <button class="nav-link" type="button" data-target="friends" aria-label="Friends and family" title="Friends and family">🕺</button>
    <button class="nav-link" type="button" data-target="mixtape" aria-label="CD collection" title="CD collection">💃</button>
    <button class="nav-link" type="button" data-target="candles" aria-label="Birthday candles" title="Birthday candles">🧑‍🩰</button>
  </nav>
  <button class="nav-scrim" id="navScrim" type="button" aria-label="Close sections menu" tabindex="-1"></button>

  <main>
    <section class="scene scene--envelope is-active" id="envelope" aria-label="Sealed envelope">
      <div class="envelope-stage">
        <div class="envelope-shadow"></div>
        <div class="envelope" id="envelopeCard">
          <div class="envelope-back"></div>
          <div class="letter-sheet" id="letterSheet" aria-hidden="true">
            <div class="letter-lines" aria-hidden="true"></div>
          </div>
          <div class="envelope-front"></div>
          <div class="envelope-flap"></div>
          <div class="wax-seal" aria-hidden="true"><span></span></div>
        </div>
      </div>
      <button class="primary-action" id="openEnvelope" type="button">Open</button>
      <button class="audio-retry" id="audioRetry" type="button" aria-label="Play background music" hidden>♪</button>
    </section>

    <section class="scene scene--home" id="home" aria-label="Homepage" hidden>
      <div class="home-layout">
        <div class="home-flower home-flower--left" aria-hidden="true">
          <svg viewBox="0 0 220 330"><path class="stem" d="M105 335 C98 250 130 165 104 70"/><path class="leaf" d="M102 240 C35 198 16 225 20 270 C55 280 82 264 102 240Z"/><g class="lily" transform="translate(104 72)"><path d="M0 0 C-52 -70 -78 -23 -38 10 C-78 32 -48 81 0 22 C48 81 78 32 38 10 C78 -23 52 -70 0 0Z"/><path class="vein" d="M0 5 L-38 -28 M0 5 L38 -28 M0 5 L-32 42 M0 5 L32 42"/></g></svg>
        </div>
        <div class="home-flower home-flower--right" aria-hidden="true">
          <svg viewBox="0 0 220 330"><path class="stem" d="M105 335 C118 245 78 158 110 65"/><path class="leaf" d="M110 250 C165 208 196 222 203 265 C164 283 132 269 110 250Z"/><g class="tulip" transform="translate(110 75)"><path d="M0 12 C-52 -4 -60 -57 -39 -79 C-20 -63 -10 -58 0 -82 C10 -58 21 -63 40 -79 C60 -57 52 -4 0 12Z"/></g></svg>
        </div>
        <div class="polaroid-collage">
          <figure class="polaroid polaroid--small polaroid--one"><div class="photo-well"><span class="add-mark" aria-hidden="true">＋</span></div></figure>
          <figure class="polaroid polaroid--small polaroid--two"><div class="photo-well"><span class="add-mark" aria-hidden="true">＋</span></div></figure>
          <figure class="polaroid polaroid--main"><div class="photo-well"><span class="add-mark" aria-hidden="true">＋</span></div></figure>
          <figure class="polaroid polaroid--small polaroid--three"><div class="photo-well"><span class="add-mark" aria-hidden="true">＋</span></div></figure>
          <figure class="polaroid polaroid--small polaroid--four"><div class="photo-well"><span class="add-mark" aria-hidden="true">＋</span></div></figure>
        </div>
      </div>
    </section>

    <section class="scene scene--archive" id="archive" aria-label="Photo archive" hidden>
      <div class="section-paper archive-paper">
        <div class="archive-grid" id="archiveGrid" aria-live="polite"></div>
      </div>
    </section>

    <section class="scene scene--friends" id="friends" aria-label="Friends and family" hidden>
      <div class="album-book">
        <div class="album-spine"></div>
        <div class="album-page album-page--photos" id="friendPhotos"></div>
        <div class="album-page album-page--letter" id="friendLetter"></div>
        <div class="album-controls">
          <button class="round-control" id="friendPrev" type="button" aria-label="Previous person" disabled>‹</button>
          <span class="page-dots" id="friendPageDots" aria-hidden="true"></span>
          <button class="round-control" id="friendNext" type="button" aria-label="Next person" disabled>›</button>
        </div>
      </div>
    </section>

    <section class="scene scene--mixtape" id="mixtape" aria-label="CD collection" hidden>
      <div class="cd-wallet">
        <div class="wallet-cover"></div>
        <div class="cd-pages" id="cdPages"></div>
        <div class="wallet-controls">
          <button class="round-control" id="cdPrev" type="button" aria-label="Previous page" disabled>‹</button>
          <span class="page-dots" id="cdPageDots" aria-hidden="true"></span>
          <button class="round-control" id="cdNext" type="button" aria-label="Next page" disabled>›</button>
        </div>
      </div>
      <div class="cd-player" id="cdPlayer" hidden>
        <button class="text-control" id="backToCDs" type="button">←</button>
        <div class="player-disc"><div class="disc-hole"></div></div>
        <div class="player-track" id="playerTrack"></div>
        <button class="primary-action" id="trackPlay" type="button">Play</button>
      </div>
    </section>

    <section class="scene scene--candles" id="candles" aria-label="Birthday candles" hidden>
      <div class="cake-area">
        <div class="cake-flower cake-flower--left" aria-hidden="true"><svg viewBox="0 0 130 180"><path class="stem" d="M62 182 C60 120 77 82 65 40"/><path class="leaf" d="M62 120 C20 91 4 109 10 137 C32 146 51 135 62 120Z"/><g class="lily" transform="translate(65 42)"><path d="M0 0 C-42 -48 -63 -16 -30 8 C-57 25 -35 59 0 17 C35 59 57 25 30 8 C63 -16 42 -48 0 0Z"/></g></svg></div>
        <div class="cake" id="cake">
          <div class="candles" id="candleSet" aria-label="18 birthday candles"></div>
          <div class="cake-tier cake-tier--top"><div class="icing-drip"></div></div>
          <div class="cake-tier cake-tier--bottom"><div class="icing-drip"></div></div>
          <div class="cake-plate"></div>
          <div class="cake-flower-detail" aria-hidden="true"> </div>
        </div>
        <div class="cake-flower cake-flower--right" aria-hidden="true"><svg viewBox="0 0 130 180"><path class="stem" d="M62 182 C60 120 77 82 65 40"/><path class="leaf" d="M62 120 C20 91 4 109 10 137 C32 146 51 135 62 120Z"/><g class="tulip" transform="translate(65 48)"><path d="M0 12 C-42 -2 -48 -45 -31 -63 C-16 -50 -8 -46 0 -66 C8 -46 17 -50 32 -63 C49 -45 42 -2 0 12Z"/></g></svg></div>
      </div>
      <div class="wish-panel" id="wishPanel">
        <textarea id="wishInput" rows="2" maxlength="500" aria-label="Birthday wish"></textarea>
        <button class="primary-action" id="confirmWish" type="button">Confirm</button>
      </div>
      <div class="blow-panel" id="blowPanel" hidden>
        <button class="primary-action" id="blowCandles" type="button">Blow the candles</button>
        <button class="text-control" id="tapBlowFallback" type="button" hidden>Tap the candles</button>
        <p class="mic-note" id="micNote" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <div class="photo-lightbox" id="photoLightbox" role="dialog" aria-modal="true" aria-label="Photo and message" hidden>
    <button class="lightbox-close" id="closeLightbox" type="button" aria-label="Close">×</button>
    <div class="lightbox-frame"><img id="lightboxImage" alt=""><p id="lightboxMessage"></p></div>
  </div>
  <div class="treasure-layer" id="treasureLayer" aria-label="Hidden treasures"></div>
  <div class="petal-finale" id="petalFinale" aria-hidden="true"></div>
  <audio id="backgroundMusic" src="assets/music/background-music.mp3" preload="none" loop></audio>
  <audio id="trackAudio" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
