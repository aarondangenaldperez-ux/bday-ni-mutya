<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Bday ni Mutya">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="art-direction.css">
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>
  <div class="floral-wash floral-wash--top" aria-hidden="true">
    <img src="assets/art/lily-tulip-study.svg" alt="">

      <g class="peanuts-lucy" transform="translate(535 174)" stroke="#62574e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">

    </svg>
  </div>

  <header class="topbar">
    <a class="wordmark" href="#envelope" aria-label="Bday ni Mutya home">Bday ni Mutya</a>
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open sections" aria-controls="sideNav" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="side-nav" id="sideNav" aria-label="Website sections" aria-hidden="true">
    <button class="nav-link" type="button" data-target="envelope" aria-label="Sealed envelope" title="Sealed envelope"><span class="nav-index">01</span><span class="nav-name">Sealed envelope</span></button>
    <button class="nav-link" type="button" data-target="home" aria-label="Homepage" title="Homepage"><span class="nav-index">02</span><span class="nav-name">Homepage</span></button>
    <button class="nav-link" type="button" data-target="mixtape" aria-label="Mixtape" title="Mixtape"><span class="nav-index">03</span><span class="nav-name">Mixtape</span></button>
    <button class="nav-link" type="button" data-target="archive" aria-label="Photo archive" title="Photo archive"><span class="nav-index">04</span><span class="nav-name">Photo archive</span></button>
    <button class="nav-link" type="button" data-target="friends" aria-label="Friends and family" title="Friends and family"><span class="nav-index">05</span><span class="nav-name">Friends &amp; family</span></button>
    <button class="nav-link" type="button" data-target="candles" aria-label="Cake" title="Cake"><span class="nav-index">06</span><span class="nav-name">Cake</span></button>
  </nav>
  <button class="nav-scrim" id="navScrim" type="button" aria-label="Close sections menu" tabindex="-1"></button>

  <main>
    <section class="scene scene--envelope is-active" id="envelope" aria-label="Sealed envelope">
      <div class="envelope-stage">
        <div class="envelope-shadow"></div>
        <div class="envelope" id="envelopeCard">
          <div class="envelope-back"></div>
          <div class="letter-sheet" id="letterSheet" aria-hidden="true">
            <div class="letter-lines" aria-hidden="true"></div>
          </div>
          <div class="envelope-front"></div>
          <div class="envelope-flap"></div>
          <div class="wax-seal" aria-hidden="true"><span></span></div>
        </div>
      </div>
      <button class="primary-action" id="openEnvelope" type="button">Open</button>
      <button class="audio-retry" id="audioRetry" type="button" aria-label="Play background music" hidden>♪</button>
    </section>

  <section class="scene scene--home" id="home" aria-label="Homepage" hidden>
      <div class="home-layout">
        <div class="home-flower home-flower--left" aria-hidden="true">
          <svg viewBox="0 0 220 330"><path class="stem" d="M105 335 C98 250 130 165 104 70"/><path class="leaf" d="M102 240 C35 198 16 225 20 270 C55 280 82 264 102 240Z"/><g class="lily" transform="translate(104 72)"><path d="M0 0 C-52 -70 -78 -23 -38 10 C-78 32 -48 81 0 22 C48 81 78 32 38 10 C78 -23 52 -70 0 0Z"/><path class="vein" d="M0 5 L-38 -28 M0 5 L38 -28 M0 5 L-32 42 M0 5 L32 42"/></g></svg>
        </div>
        <div class="home-flower home-flower--right" aria-hidden="true">
          <svg viewBox="0 0 220 330"><path class="stem" d="M105 335 C118 245 78 158 110 65"/><path class="leaf" d="M110 250 C165 208 196 222 203 265 C164 283 132 269 110 250Z"/><g class="tulip" transform="translate(110 75)"><path d="M0 12 C-52 -4 -60 -57 -39 -79 C-20 -63 -10 -58 0 -82 C10 -58 21 -63 40 -79 C60 -57 52 -4 0 12Z"/></g></svg>
        </div>
        <div class="polaroid-collage">
          <figure class="polaroid polaroid--small polaroid--one"><div class="photo-well"></div></figure>
          <figure class="polaroid polaroid--small polaroid--two"><div class="photo-well"></div></figure>
          <figure class="polaroid polaroid--main"><div class="photo-well"></div></figure>
          <figure class="polaroid polaroid--small polaroid--three"><div class="photo-well"></div></figure>
          <figure class="polaroid polaroid--small polaroid--four"><div class="photo-well"></div></figure>
        </div>
      </div>
    </section>

  <section class="scene scene--mixtape" id="mixtape" aria-label="CD collection" hidden>
      <div class="cd-wallet">
        <div class="wallet-cover"></div>
        <div class="cd-pages" id="cdPages"></div>
        <div class="wallet-controls">
          <button class="round-control" id="cdPrev" type="button" aria-label="Previous page" disabled>‹</button>
          <span class="page-dots" id="cdPageDots" aria-hidden="true"></span>
          <button class="round-control" id="cdNext" type="button" aria-label="Next page" disabled>›</button>
        </div>
      </div>
      <div class="cd-player" id="cdPlayer" hidden>
        <button class="text-control" id="backToCDs" type="button" aria-label="Back to CD collection">←</button>
        <div class="player-disc"><div class="disc-hole"></div></div>
        <div class="player-track" id="playerTrack"></div>
        <button class="primary-action" id="trackPlay" type="button">Play</button>
      </div>
    </section>

  <section class="scene scene--archive" id="archive" aria-label="Photo archive" hidden>
      <div class="section-paper archive-paper">
        <div class="archive-grid" id="archiveGrid" aria-live="polite"></div>
      </div>
    </section>

  <section class="scene scene--friends" id="friends" aria-label="Friends and family" hidden>
      <div class="album-book">
        <div class="album-spine"></div>
        <div class="album-page album-page--photos" id="friendPhotos"></div>
        <div class="album-page album-page--letter" id="friendLetter"></div>
        <div class="album-controls">
          <button class="round-control" id="friendPrev" type="button" aria-label="Previous person" disabled>‹</button>
          <span class="page-dots" id="friendPageDots" aria-hidden="true"></span>
          <button class="round-control" id="friendNext" type="button" aria-label="Next person" disabled>›</button>
        </div>
      </div>
    </section>

  <section class="scene scene--candles" id="candles" aria-label="Birthday candles" hidden>
      <div class="cake-area">
        <div class="cake-flower cake-flower--left" aria-hidden="true">
          <svg viewBox="0 0 130 180" role="presentation">
            <path class="stem" d="M62 182 C60 120 77 82 65 40"/>
            <path class="leaf" d="M62 120 C20 91 4 109 10 137 C32 146 51 135 62 120Z"/>
            <g class="lily" transform="translate(65 42)">
              <path d="M0 0 C-42 -48 -63 -16 -30 8 C-57 25 -35 59 0 17 C35 59 57 25 30 8 C63 -16 42 -48 0 0Z"/>
              <path class="vein" d="M0 4 L-25 -27 M0 4 L25 -27 M0 4 L-22 30 M0 4 L22 30"/>
              <circle cx="0" cy="5" r="3"/>
            </g>
          </svg>
        </div>

        <div class="cake" id="cake" role="group" aria-label="Two-tier pink watercolor birthday cake decorated with lilies and eighteen candles">
          <div class="candles" id="candleSet" role="group" aria-label="Eighteen lit birthday candles"></div>

          <div class="cake-tier cake-tier--top" aria-hidden="true">
            <div class="icing-drip"></div>
            <div class="cake-beadline"></div>
          </div>
          <div class="cake-tier cake-tier--bottom" aria-hidden="true">
            <div class="icing-drip"></div>
            <div class="cake-beadline"></div>
          </div>

          <div class="cake-flower-detail" aria-hidden="true">
            <svg class="cake-flower-art" viewBox="0 0 400 140" role="presentation">
              <path class="cake-vine" d="M32 112 C86 50 132 100 186 83 S286 92 368 30"/>
              <path class="cake-leaf" d="M73 83 C38 51 20 56 18 79 C37 98 58 97 73 83Z"/>
              <path class="cake-leaf" d="M149 91 C139 119 111 128 91 116 C104 93 127 86 149 91Z"/>
              <path class="cake-leaf" d="M232 81 C240 48 267 38 286 49 C272 73 252 83 232 81Z"/>
              <path class="cake-leaf" d="M321 61 C341 82 366 79 378 59 C358 43 338 45 321 61Z"/>

              <g class="cake-lily-bloom" transform="translate(108 64) scale(.72)">
                <path class="cake-lily-petal cake-lily-petal--1" d="M0 3 C-13 -15 -22 -43 -7 -56 C4 -56 8 -25 3 3Z"/>
                <path class="cake-lily-petal cake-lily-petal--2" d="M1 2 C4 -19 10 -49 25 -51 C37 -45 20 -13 3 5Z"/>
                <path class="cake-lily-petal cake-lily-petal--3" d="M3 2 C22 -12 44 -27 54 -16 C59 -3 28 8 4 7Z"/>
                <path class="cake-lily-petal cake-lily-petal--4" d="M3 4 C24 14 44 31 37 44 C24 51 8 25 0 7Z"/>
                <path class="cake-lily-petal cake-lily-petal--5" d="M0 5 C-3 27 -8 52 -22 53 C-35 44 -15 13 -2 3Z"/>
                <path class="cake-lily-petal cake-lily-petal--6" d="M-3 3 C-24 14 -50 22 -55 8 C-56 -7 -23 -8 -3 0Z"/>
                <path class="cake-lily-vein" d="M0 4 L-5 -43 M2 4 L20 -39 M4 4 L44 -13 M3 6 L29 36 M-1 7 L-19 43 M-4 4 L-43 4"/>
                <path class="cake-stamen" d="M0 4 L8 -18 M0 4 L-8 -20 M0 4 L14 -12"/>
                <circle class="cake-lily-center" cx="0" cy="4" r="5"/>
              </g>

              <g class="cake-lily-bloom cake-lily-bloom--small" transform="translate(292 54) scale(.54) rotate(18)">
                <path class="cake-lily-petal cake-lily-petal--1" d="M0 3 C-13 -15 -22 -43 -7 -56 C4 -56 8 -25 3 3Z"/>
                <path class="cake-lily-petal cake-lily-petal--2" d="M1 2 C4 -19 10 -49 25 -51 C37 -45 20 -13 3 5Z"/>
                <path class="cake-lily-petal cake-lily-petal--3" d="M3 2 C22 -12 44 -27 54 -16 C59 -3 28 8 4 7Z"/>
                <path class="cake-lily-petal cake-lily-petal--4" d="M3 4 C24 14 44 31 37 44 C24 51 8 25 0 7Z"/>
                <path class="cake-lily-petal cake-lily-petal--5" d="M0 5 C-3 27 -8 52 -22 53 C-35 44 -15 13 -2 3Z"/>
                <path class="cake-lily-petal cake-lily-petal--6" d="M-3 3 C-24 14 -50 22 -55 8 C-56 -7 -23 -8 -3 0Z"/>
                <path class="cake-lily-vein" d="M0 4 L-5 -43 M2 4 L20 -39 M4 4 L44 -13 M3 6 L29 36 M-1 7 L-19 43 M-4 4 L-43 4"/>
                <path class="cake-stamen" d="M0 4 L8 -18 M0 4 L-8 -20 M0 4 L14 -12"/>
                <circle class="cake-lily-center" cx="0" cy="4" r="5"/>
              </g>

              <path class="cake-bud" d="M201 91 C187 70 193 54 207 49 C221 58 220 76 201 91Z"/>
              <path class="cake-bud-vein" d="M201 88 L207 57"/>
            </svg>
          </div>

          <div class="cake-plate" aria-hidden="true"></div>
        </div>

        <div class="cake-flower cake-flower--right" aria-hidden="true">
          <svg viewBox="0 0 130 180" role="presentation">
            <path class="stem" d="M62 182 C60 120 77 82 65 40"/>
            <path class="leaf" d="M62 120 C20 91 4 109 10 137 C32 146 51 135 62 120Z"/>
            <g class="tulip" transform="translate(65 48)">
              <path d="M0 12 C-42 -2 -48 -45 -31 -63 C-16 -50 -8 -46 0 -66 C8 -46 17 -50 32 -63 C49 -45 42 -2 0 12Z"/>
              <path class="vein" d="M0 8 L0 -45"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="wish-panel" id="wishPanel">
        <textarea id="wishInput" rows="2" maxlength="500" aria-label="Birthday wish" placeholder="Type your birthday wish..." autocomplete="off" spellcheck="false"></textarea>
        <p class="privacy-note">Your wish is not saved or sent. It clears when you confirm.</p>
        <button class="primary-action" id="confirmWish" type="button">Confirm</button>
      </div>
      <div class="blow-panel" id="blowPanel" hidden>
        <button class="primary-action" id="blowCandles" type="button">Blow the candles</button>
        <button class="text-control" id="tapBlowFallback" type="button" hidden>Tap the candles instead</button>
        <p class="mic-note" id="micNote" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <div class="photo-lightbox" id="photoLightbox" role="dialog" aria-modal="true" aria-label="Photo and message" hidden>
    <button class="lightbox-close" id="closeLightbox" type="button" aria-label="Close">×</button>
    <div class="lightbox-frame"><img id="lightboxImage" alt=""><p id="lightboxMessage"></p></div>
  </div>
  <div class="treasure-layer" id="treasureLayer" aria-label="Hidden treasures"></div>
  <div class="petal-finale" id="petalFinale" aria-hidden="true"></div>
  <audio id="backgroundMusic" src="assets/music/background-music.mp3" preload="none" loop></audio>
  <audio id="trackAudio" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
